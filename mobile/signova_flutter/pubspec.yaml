name: signova_flutter
description: Private beta mobile app for Signova.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0
  cloud_firestore: ^6.1.0
  crypto: ^3.0.6
  firebase_auth: ^6.2.0
  firebase_core: ^4.4.0
  flutter_webrtc: ^1.4.1
  flutter_onnxruntime: ^1.9.0
  hand_detection: ^4.3.1
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

hooks:
  user_defines:
    dartcv4:
      ios:
        deployment_target: '16.0'
